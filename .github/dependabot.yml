# Dependabot configuration — XStreamRoll
#
# Configures routine dependency update PRs for every `package.json` in the
# XStreamRoll monorepo (root + 4 workspaces). Each workspace gets its own
# entry so PRs are batched per component and labeled accordingly.
#
# Security-advisory handling (separate from this file):
#   GitHub-native Dependabot Security Updates runs *outside* this config.
#   It is controlled by the repository toggle under
#     Settings → Code security and analysis → "Dependabot security updates".
#   When that toggle is on, security advisories create near-real-time PRs
#   that bypass the weekly schedule below. The auto-merge workflow
#   (`.github/workflows/dependabot-auto-merge.yml`) merges the resulting
#   `security-update` PRs once CI is green.
#
# Routine-version handling (this file):
#   - weekly version-update PRs (Mondays 09:00 UTC), grouped per package family
#   - patch updates that pass CI are auto-merged as squash commits
#   - minor / major updates require manual review

version: 2

updates:
  # ── Root workspace ────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    labels:
      - "dependencies"
      - "ci"

  # ── API (NestJS) ──────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    labels:
      - "dependencies"
      - "ci"
      - "area:api"

  # ── App (Next.js) ─────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-*"
          - "next"
      radix:
        patterns: ["@radix-ui/*"]
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    labels:
      - "dependencies"
      - "ci"
      - "area:app"

  # ── SDK ───────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/xstreamroll-sdk"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    labels:
      - "dependencies"
      - "ci"
      - "area:sdk"

  # ── Worker (processing) ───────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/xstreamroll-processing"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    labels:
      - "dependencies"
      - "ci"
      - "area:processing"
