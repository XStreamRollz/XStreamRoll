name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Install ALL workspace dependencies in one shot via the root
      # `npm ci`. The npm CLI does not support `npm ci` inside individual
      # workspaces (their lockfile would have to be present at that
      # path), so a single root install is both correct and faster than
      # the previous `cd <workspace> && npm install` loop. #375.
      - name: Install workspace dependencies
        run: npm ci

      - name: Build types package
        run: npm run build --workspace=packages/types

      - name: Build contract tests package
        run: npm run build --workspace=tests/contracts

      - name: Lint — types
        run: cd packages/types && npm run lint

      - name: Lint — contract tests
        run: cd tests/contracts && npm run lint

      - name: Lint — api
        run: cd api && npm run lint
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test-secret
          STREAM_API_KEY: test-api-key

      - name: Lint — sdk
        run: cd xstreamroll-sdk && npm run lint

      - name: Lint — processing
        run: cd xstreamroll-processing && npm run lint

      - name: Lint — app
        run: cd app && npm run lint

      - name: Typecheck — types (build must succeed cleanly)
        run: cd packages/types && npm run typecheck

      - name: Typecheck — contract tests
        run: cd tests/contracts && npm run typecheck

      - name: Typecheck — api
        run: cd api && npx tsc --noEmit

      - name: Typecheck — sdk
        run: cd xstreamroll-sdk && npx tsc --noEmit

      - name: Typecheck — processing
        run: cd xstreamroll-processing && npx tsc --noEmit

      - name: Typecheck — app
        run: cd app && npx tsc --noEmit

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      # Provider verification for tests/contracts/ runs as part of this
      # step (api/src/contract-provider.spec.ts matches the api Jest
      # config's `*.spec.ts` pattern) — a contract violation fails the
      # build the same way any other api test failure would.
      - name: Test — api (with coverage)
        run: cd api && npm run test:cov
        env:
          DATABASE_URL: postgresql://xstreamroll:xstreamroll@localhost:5433/xstreamroll_test
          JWT_SECRET: test-secret
          STREAM_API_KEY: test-api-key

      - name: Stop test database
        run: docker compose -f docker-compose.test.yml down -v

      # Consumer contract verification for tests/contracts/ runs as part
      # of this step (xstreamroll-sdk/__tests__/contract.consumer.test.ts).
      - name: Test — sdk (with coverage)
        run: cd xstreamroll-sdk && npm run test:cov

      - name: Test — processing (with coverage)
        run: cd xstreamroll-processing && npm run test:cov

      - name: Test — app (with coverage)
        run: cd app && npm run test:cov

      - name: Upload api coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./api/coverage/lcov.info
          flags: api
          name: api-coverage
          fail_ci_if_error: false

      - name: Upload sdk coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./xstreamroll-sdk/coverage/lcov.info
          flags: sdk
          name: sdk-coverage
          fail_ci_if_error: false

      - name: Upload processing coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./xstreamroll-processing/coverage/lcov.info
          flags: processing
          name: processing-coverage
          fail_ci_if_error: false

      - name: Upload app coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./app/coverage/lcov.info
          flags: app
          name: app-coverage
          fail_ci_if_error: false

      # Lockfile-drift guard (issue #375). If any `npm ci` invocation
      # above ended up mutating a `package-lock.json` file, the diff
      # vs HEAD will be non-empty and the workflow fails. Paths are
      # listed explicitly because some of the workspaces (app, sdk,
      # processing, packages/types, tests/contracts) do not have a
      # workspace-local lockfile today—npm workspaces inherit lockfile
      # resolution from the root; if a future PR adds a workspace-level
      # lockfile, this list MUST be updated.
      - name: Verify lockfile integrity
        run: |
          set -e
          # Snapshot every lockfile that npm could conceivably touch.
          # Today this is just the root + api; the other workspaces
          # resolve via the root lockfile, but listing them here keeps
          # the guard future-proof.
          LOCKFILES=(
            "package-lock.json"
            "api/package-lock.json"
            "app/package-lock.json"
            "xstreamroll-sdk/package-lock.json"
            "xstreamroll-processing/package-lock.json"
            "packages/types/package-lock.json"
            "tests/contracts/package-lock.json"
          )
          # Translate each into a `-- path` arg that ignores files
          # that don't exist (e.g., workspace-level lockfiles added
          # later).
          PATHS=()
          for f in "${LOCKFILES[@]}"; do
            [ -f "$f" ] && PATHS+=("$f")
          done
          if git diff --exit-code HEAD -- "${PATHS[@]}"; then
            echo "Lockfiles are unchanged — npm ci respected the committed package-lock.json files."
          else
            echo "::error::npm ci mutated a package-lock.json. Run 'npm install' locally, commit the resulting package-lock.json, and re-run the workflow."
            exit 1
          fi

  bundle-analysis:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Build types package
        run: npm run build --workspace=packages/types

      - name: Build app with analysis
        run: cd app && npm run analyze

      - name: List analyzer output
        run: ls -la app/.next || true; ls -la app/.next/analyze || true

      - name: Check bundle sizes
        run: node .github/scripts/check-bundle-size.js
        env:
          BUNDLE_BUDGET_TOTAL: 5000000
          BUNDLE_BUDGET_PER_LARGEST: 500000

      - name: Upload analyzer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-analysis
          path: app/.next/analyze

      - name: Upload bundle summary
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-summary
          path: app/.next/analyze/summary.json

      # Same lockfile-drift invariant as the `quality` job (#375). The
      # bundle-analysis install path runs again here, so any accidental
      # mutation to a package-lock.json must also fail this job rather
      # than silently propagate.
      - name: Verify lockfile integrity
        run: |
          set -e
          LOCKFILES=(
            "package-lock.json"
            "api/package-lock.json"
            "app/package-lock.json"
            "xstreamroll-sdk/package-lock.json"
            "xstreamroll-processing/package-lock.json"
            "packages/types/package-lock.json"
            "tests/contracts/package-lock.json"
          )
          PATHS=()
          for f in "${LOCKFILES[@]}"; do
            [ -f "$f" ] && PATHS+=("$f")
          done
          if git diff --exit-code HEAD -- "${PATHS[@]}"; then
            echo "Lockfiles are unchanged — npm ci respected the committed package-lock.json files."
          else
            echo "::error::npm ci mutated a package-lock.json. Run 'npm install' locally, commit the resulting package-lock.json, and re-run the workflow."
            exit 1
          fi

      - name: Comment PR with summary
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v6
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'app/.next/analyze/summary.json';
            if (fs.existsSync(path)) {
              const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
              const body = `Bundle analysis summary:\n\n- Total JS size: ${summary.totalBytes} bytes\n- Largest file: ${summary.largestFile} (${summary.largestBytes} bytes)\n\nArtifacts: app-bundle-analysis`;
              github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else {
              console.log('No summary available')
            }
